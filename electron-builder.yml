# How the app is packaged.
#
# A Windows installer carrying both architectures, because "everyone is on
# 64-bit Windows" stopped being one thing. The Snapdragon laptops are ARM, and
# Windows will happily run an x64 build on them by emulating it — quietly, with
# no error, and at a fraction of the speed. Chromium is the worst possible thing
# to emulate: the window stutters, and the compositor falls far enough behind
# that clicks land on nothing. Shipping arm64 as well is what stops that, and it
# has to stay shipped — dropping back to x64 alone would bring the stutter back
# on the one machine nobody tests on.
#
# The installer is not signed — a certificate costs a few hundred a year and
# there are four users — so Windows shows "protected your PC" on the first run
# of each version. "More info" then "Run anyway" gets past it.

appId: in.ambicapatterns.palletspec
productName: Pallet Spec
copyright: © Ambica Patterns (India) Pvt. Ltd.

directories:
  output: release
  buildResources: build

# The app is one bundled file plus the production dependencies electron-builder
# works out for itself. Everything the program reads at run time is below.
files:
  - dist/electron/**/*
  - package.json

extraResources:
  # The built editor, served from inside the app.
  - from: dist/editor
    to: editor
  # Costing rates. Sealed in: one set of prices that everybody quotes from,
  # changed by shipping a new version.
  - from: config/rates.json
    to: rates.json
  # The company's name, its mark and the face the watermark is set in. Data
  # rather than code, so a different company is a different file rather than a
  # different build — and a brand.json in the designs folder beats this one.
  - from: config/brand.json
    to: brand/brand.json
  - from: config/brand
    to: brand/brand
  - from: build/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      # Both, in one installer that picks the right one on the machine it is
      # run on. Nobody has to know which laptop they are holding.
      arch: [x64, arm64]
  icon: build/icon.png

nsis:
  # Not one-click: somebody installing a tool they have never seen should get
  # to read what it is going to do first.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pallet Spec

mac:
  target:
    # The zip is what an update is delivered as; the dmg is what a person
    # installs from. Windows needs no such pair — its installer is both.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.png
  category: public.app-category.productivity

# Updates come from the releases on the repository. It is public, so no token
# is needed anywhere — neither in the app nor on anybody's machine.
publish:
  provider: github
  owner: WeWake1
  repo: pallet_maker
